services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fintrack
      POSTGRES_USER: fintrack
      POSTGRES_PASSWORD: fintrack_local_only
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - fintrack_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fintrack -d fintrack']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  fintrack_postgres:
